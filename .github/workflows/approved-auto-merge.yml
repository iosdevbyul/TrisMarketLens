name: Approved PR auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only explicitly approved automation PRs
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.repository?.full_name !== context.repo.owner + "/" + context.repo.repo) return;
            if (run.head_repository?.full_name !== context.repo.owner + "/" + context.repo.repo) return;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            const eligible = prs.filter(pr =>
              pr.head.sha === run.head_sha &&
              pr.head.repo?.full_name === context.repo.owner + "/" + context.repo.repo &&
              pr.head.ref.startsWith("auto/") &&
              pr.base.ref === "main" &&
              pr.user.login === context.repo.owner &&
              pr.draft === false &&
              pr.labels.some(label => label.name === "auto-merge-approved")
            );
            if (eligible.length !== 1) {
              core.info("No uniquely approved automation PR for this successful CI run.");
              return;
            }
            const pr = eligible[0];
            const { data: current } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            if (current.head.sha !== run.head_sha || current.mergeable !== true || current.state !== "open") {
              core.info("PR changed, conflicts, or mergeability not confirmed. Leaving open.");
              return;
            }
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              merge_method: "squash", sha: run.head_sha
            });
            core.info("PR #" + pr.number + " merged: " + result.data.merged);
