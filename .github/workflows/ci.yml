name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Check integration verifier syntax (offline)
        run: npm run verify:scripts

      - name: Build
        run: npm run build

      # Browser tests are part of the same required checks job, so PR auto-merge
      # cannot declare the existing CI job successful before Chromium passes.
      - name: Install pinned Playwright runner (isolated from npm ci tree)
        shell: bash
        run: |
          set -euo pipefail
          runner_dir="$RUNNER_TEMP/tris-playwright-runner"
          mkdir -p "$runner_dir"
          npm install --prefix "$runner_dir" --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
          mkdir -p node_modules/@playwright
          ln -s "$runner_dir/node_modules/@playwright/test" node_modules/@playwright/test
          ln -s "$runner_dir/node_modules/playwright" node_modules/playwright
          ln -s "$runner_dir/node_modules/playwright-core" node_modules/playwright-core
          ln -s "$runner_dir/node_modules/.bin/playwright" node_modules/.bin/playwright

      - name: Install Chromium browser and system libraries
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (controlled mock only)
        run: npm run test:e2e
        env:
          MARKET_LENS_DATA_SOURCE: mock
          MARKET_LENS_SCREENER_SOURCE: mock
          MARKET_LENS_OPERATIONS_SOURCE: mock
          MARKET_LENS_OHLCV_SOURCE: disconnected
          MARKET_LENS_STOCK_ANALYSIS_SOURCE: disconnected
          DONGHAK_API_BASE_URL: ""

      - name: Attach browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
