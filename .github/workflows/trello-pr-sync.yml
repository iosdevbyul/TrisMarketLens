name: Sync approved PR to Trello

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == github.repository_owner
    steps:
      - name: Update linked card state
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_IN_PROGRESS_LIST_ID: ${{ vars.TRELLO_IN_PROGRESS_LIST_ID }}
          TRELLO_DONE_LIST_ID: ${{ vars.TRELLO_DONE_LIST_ID }}
          TRELLO_BACKLOG_LIST_ID: ${{ vars.TRELLO_BACKLOG_LIST_ID }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const env = process.env;
          if (!env.PR_HEAD_REF.startsWith("auto/") ||
              env.PR_HEAD_REPO !== env.REPOSITORY ||
              env.PR_BASE_REF !== "main") process.exit(0);
          const match = /^Trello-Card:\s*https:\/\/trello\.com\/c\/([A-Za-z0-9]{8})(?:\/[^\s]*)?\s*$/im.exec(env.PR_BODY ?? "");
          if (!match) { console.log("No linked Trello card in PR body; skipping."); process.exit(0); }
          if (!env.TRELLO_KEY || !env.TRELLO_TOKEN ||
              !env.TRELLO_IN_PROGRESS_LIST_ID || !env.TRELLO_DONE_LIST_ID ||
              !env.TRELLO_BACKLOG_LIST_ID) {
            console.log("Trello credentials or list IDs not configured; skipping.");
            process.exit(0);
          }
          let listId;
          if (env.PR_ACTION === "closed") {
            listId = env.PR_MERGED === "true" ? env.TRELLO_DONE_LIST_ID : env.TRELLO_BACKLOG_LIST_ID;
          } else {
            listId = env.TRELLO_IN_PROGRESS_LIST_ID;
          }
          const cardId = match[1];
          const params = new URLSearchParams({
            key: env.TRELLO_KEY, token: env.TRELLO_TOKEN, idList: listId
          });
          const response = await fetch("https://api.trello.com/1/cards/" + encodeURIComponent(cardId), {
            method: "PUT",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params
          });
          if (!response.ok) throw Error("Trello move failed with HTTP " + response.status);
          console.log("Linked Trello card moved for PR action: " + env.PR_ACTION);
          NODE
